- name: variable preference
  hosts: local
  connection: local
  vars:
    Medicine: "From Play"
  vars.prompt:
      prompt: "Enter Medicine name"
      private: no
  Vars_files:
    - Medicine.yml
  tasks:
    - name: Print the Medicine details
      vars:
        Medicine: "From Play"
      ansible.builtin.debug:
        msg: "Hello {{Medicine}}"

#Preference of variable is as follows:

# 1. CMD
# 2. task
# 3. File
# 4. prompt
# 5. PLAY
# 6. Inventory