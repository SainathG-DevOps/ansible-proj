- name: Gain facts
  hosts: local
  connection: local
  tasks:
    - name: Gather facts
      ansible.builtin.debug:
        msg: "{{ ansible_facts }}"
    
    - name: Print the vars
      ansible.builtin.debug:
        msg: |
          os-family: "{{ ansible_facts['os_family'] }}"
          private-ip: "{{ ansible_facts['default_ipv4']['address'] }}"
